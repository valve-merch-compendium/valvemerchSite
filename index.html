<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manifold | A Valve Merch Archive</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

<div class="container">
    <div class="visual-column">
        <div id="display-area" class="image-square">
            <div class="placeholder-text">Syncing...</div>
        </div>
        <div class="nav-arrows">
            <button id="prevBtn" aria-label="Previous">‹</button>
            <button id="nextBtn" aria-label="Next">›</button>
        </div>
    </div>

    <div class="info-column">
        <h1 id="item-name" class="item-name-heading">---</h1>
        <span class="label">Game</span><div id="item-game" class="value">—</div>
        <span class="label">Merch Type</span><div id="item-type" class="value">—</div>
        <span class="label">Year Released</span><div id="item-year" class="value">—</div>
        <span class="label">Employee Only</span><div id="item-employee" class="value">—</div>
        
        <div class="price-container">
            <div id="item-price" class="price-tag">---</div>
        </div>
        
        <div id="counter" class="counter">0 / 0</div>
    </div>
</div>

<div class="search-sidebar">
    <h2 class="search-title">Search</h2>
    
    <div class="search-group">
        <label for="game-search" class="search-label">Game Title</label>
        <select id="game-search" class="search-input">
            <option value="">All Games</option>
            <option value="half-life">Half-Life</option>
                <option value="opposing-force">Half-Life: Opposing Force</option>
                <option value="blue-shift">Half-Life: Blue Shift</option>
                <option value="decay">Half-Life: Decay</option>
                <option value="uplink">Half-Life: Uplink</option>
                <option value="hl-source">Half-Life: Source</option>
                <option value="half-life-2">Half-Life 2</option>
                <option value="hl2-ep1">Half-Life 2: Episode One</option>
                <option value="hl2-ep2">Half-Life 2: Episode Two</option>
                <option value="hl2-dm">Half-Life 2: Deathmatch</option>
                <option value="hl2-lost">Half-Life 2: Lost Coast</option>
                <option value="half-life-alyx">Half-Life Alyx</option>
                <option value="counter-strike">Counter Strike</option>
                <option value="cs-condition-zero">Counter Strike: Condition Zero</option>
                <option value="cs-cz-deleted">Counter Strike: Condition Zero Deleted Scenes</option>
                <option value="cs-source">Counter Strike: Source</option>
                <option value="cs-global-offensive">Counter Strike: Global Offensive</option>
                <option value="cs-go-2">Counter Strike 2</option>
                <option value="team-fortress-classic">Team Fortress Classic</option>
                <option value="team-fortress-two">Team Fortress 2</option>
                <option value="portal">Portal </option>
                <option value="portal2">Portal 2 </option>                    <option value="left-4-dead">Left 4 Dead </option>
                <option value="left-4-dead-2">Left 4 Dead 2 </option>
                <option value="dota-2">DOTA 2 </option>
                <option value="dota-underlords">DOTA Underlords</option>
                <option value="artifact">Artifact</option>
                <option value="ricochet">Ricochet</option>
                <option value="day-defeat">Day of Defeat</option>                    <option value="day-defeat-source">Day of Defeat: Source</option>
                <option value="alien-swarm">Alien Swarm</option>
                <option value="the-lab">The Lab</option>
                <option value="ap-hand-lab">Aperture Hand Lab</option>
                <option value="ap-desk-job">Aperture Desk Job</option>
                <option value="deadlock">Deadlock</option>
                <option value="steam">Steam</option>
        </select>
    </div>
    
    <div class="search-group">
        <label for="merch-search" class="search-label">Merch Type</label>
        <input type="text" id="merch-search" class="search-input" placeholder="Filter by merch...">
    </div>
    
    <button id="clear-filters" class="clear-button">Clear Filters</button>
</div>

<script src="script.js"></script>
</body>
</html>
